[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "erc20-scanner"
version = "0.2.1"
description = "Fast CLI scanner for EVM ERC-20 transfer and approval logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.25.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
erc20-scan = "erc20_scanner.cli:main"
